name: Release

# Push a tag like v0.1.0 to build a signed APK and attach it to a GitHub Release.
# Needs these repository secrets: DEEPPILOT_KEYSTORE_BASE64, DEEPPILOT_KEYSTORE_PASSWORD,
# DEEPPILOT_KEY_ALIAS, DEEPPILOT_KEY_PASSWORD. The keystore never enters the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEEPPILOT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "DEEPPILOT_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DEEPPILOT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          DEEPPILOT_KEYSTORE_PASSWORD: ${{ secrets.DEEPPILOT_KEYSTORE_PASSWORD }}
          DEEPPILOT_KEY_ALIAS: ${{ secrets.DEEPPILOT_KEY_ALIAS }}
          DEEPPILOT_KEY_PASSWORD: ${{ secrets.DEEPPILOT_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :core:test :app:assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DeepPilot-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
